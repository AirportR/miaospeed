name: build and releases

on:
  workflow_dispatch:
  push:
    # run only against tags
    tags:
      - '*'

jobs:
  deps:
    name: deps (go mod download)
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
          cache: false

      - name: Restore Go module cache
        id: gomod-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/go/pkg/sumdb
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}

      - name: Download modules
        run: go mod download

  build-linux-x86:
    name: build linux x86
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
          cache: false

      - name: Restore Go module cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/go/pkg/sumdb
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}

      - name: Fix embeded
        run: |
          go env
          mkdir -p ./preconfigs/embeded/miaokoCA
          echo "${{ secrets.MIAOSPEED_CRT }}" > ./preconfigs/embeded/miaokoCA/miaoko.crt
          echo "${{ secrets.MIAOSPEED_KEY }}" > ./preconfigs/embeded/miaokoCA/miaoko.key
          echo "${{ secrets.MS_BUILDTOKEN }}" > ./utils/embeded/BUILDTOKEN.key
          head -n 5 ./engine/embeded/default_geoip.js

      - name: Build archives
        run: |
          mkdir -p ./bin
          make linux-386.gz linux-amd64.gz linux-amd64-v3.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-x86
          path: ./bin/*

  build-linux-arm:
    name: build linux arm
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
          cache: false

      - name: Restore Go module cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/go/pkg/sumdb
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}

      - name: Fix embeded
        run: |
          go env
          mkdir -p ./preconfigs/embeded/miaokoCA
          echo "${{ secrets.MIAOSPEED_CRT }}" > ./preconfigs/embeded/miaokoCA/miaoko.crt
          echo "${{ secrets.MIAOSPEED_KEY }}" > ./preconfigs/embeded/miaokoCA/miaoko.key
          echo "${{ secrets.MS_BUILDTOKEN }}" > ./utils/embeded/BUILDTOKEN.key
          head -n 5 ./engine/embeded/default_geoip.js

      - name: Build archives
        run: |
          mkdir -p ./bin
          make linux-armv5.gz linux-armv6.gz linux-armv7.gz linux-arm64.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-arm
          path: ./bin/*

  build-linux-mips:
    name: build linux mips
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
          cache: false

      - name: Restore Go module cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/go/pkg/sumdb
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}

      - name: Fix embeded
        run: |
          go env
          mkdir -p ./preconfigs/embeded/miaokoCA
          echo "${{ secrets.MIAOSPEED_CRT }}" > ./preconfigs/embeded/miaokoCA/miaoko.crt
          echo "${{ secrets.MIAOSPEED_KEY }}" > ./preconfigs/embeded/miaokoCA/miaoko.key
          echo "${{ secrets.MS_BUILDTOKEN }}" > ./utils/embeded/BUILDTOKEN.key
          head -n 5 ./engine/embeded/default_geoip.js

      - name: Build archives
        run: |
          mkdir -p ./bin
          make \
            linux-mips-softfloat.gz linux-mips-hardfloat.gz \
            linux-mipsle-softfloat.gz linux-mipsle-hardfloat.gz \
            linux-mips64.gz linux-mips64le.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-mips
          path: ./bin/*

  build-linux-misc:
    name: build linux misc
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
          cache: false

      - name: Restore Go module cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/go/pkg/sumdb
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}

      - name: Fix embeded
        run: |
          go env
          mkdir -p ./preconfigs/embeded/miaokoCA
          echo "${{ secrets.MIAOSPEED_CRT }}" > ./preconfigs/embeded/miaokoCA/miaoko.crt
          echo "${{ secrets.MIAOSPEED_KEY }}" > ./preconfigs/embeded/miaokoCA/miaoko.key
          echo "${{ secrets.MS_BUILDTOKEN }}" > ./utils/embeded/BUILDTOKEN.key
          head -n 5 ./engine/embeded/default_geoip.js

      - name: Build archives
        run: |
          mkdir -p ./bin
          make linux-riscv64.gz linux-loong64.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-misc
          path: ./bin/*

  build-darwin:
    name: build darwin
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
          cache: false

      - name: Restore Go module cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/go/pkg/sumdb
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}

      - name: Fix embeded
        run: |
          go env
          mkdir -p ./preconfigs/embeded/miaokoCA
          echo "${{ secrets.MIAOSPEED_CRT }}" > ./preconfigs/embeded/miaokoCA/miaoko.crt
          echo "${{ secrets.MIAOSPEED_KEY }}" > ./preconfigs/embeded/miaokoCA/miaoko.key
          echo "${{ secrets.MS_BUILDTOKEN }}" > ./utils/embeded/BUILDTOKEN.key
          head -n 5 ./engine/embeded/default_geoip.js

      - name: Build archives
        run: |
          mkdir -p ./bin
          make darwin-amd64.gz darwin-amd64-v3.gz darwin-arm64.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bin-darwin
          path: ./bin/*

  build-freebsd:
    name: build freebsd
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
          cache: false

      - name: Restore Go module cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/go/pkg/sumdb
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}

      - name: Fix embeded
        run: |
          go env
          mkdir -p ./preconfigs/embeded/miaokoCA
          echo "${{ secrets.MIAOSPEED_CRT }}" > ./preconfigs/embeded/miaokoCA/miaoko.crt
          echo "${{ secrets.MIAOSPEED_KEY }}" > ./preconfigs/embeded/miaokoCA/miaoko.key
          echo "${{ secrets.MS_BUILDTOKEN }}" > ./utils/embeded/BUILDTOKEN.key
          head -n 5 ./engine/embeded/default_geoip.js

      - name: Build archives
        run: |
          mkdir -p ./bin
          make freebsd-386.gz freebsd-amd64.gz freebsd-amd64-v3.gz freebsd-arm64.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bin-freebsd
          path: ./bin/*

  build-windows:
    name: build windows
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
          cache: false

      - name: Restore Go module cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/go/pkg/sumdb
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}

      - name: Fix embeded
        run: |
          go env
          mkdir -p ./preconfigs/embeded/miaokoCA
          echo "${{ secrets.MIAOSPEED_CRT }}" > ./preconfigs/embeded/miaokoCA/miaoko.crt
          echo "${{ secrets.MIAOSPEED_KEY }}" > ./preconfigs/embeded/miaokoCA/miaoko.key
          echo "${{ secrets.MS_BUILDTOKEN }}" > ./utils/embeded/BUILDTOKEN.key
          head -n 5 ./engine/embeded/default_geoip.js

      - name: Build archives
        run: |
          mkdir -p ./bin
          make windows-386.zip windows-amd64.zip windows-amd64-v3.zip windows-arm64.zip windows-armv7.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bin-windows
          path: ./bin/*

  release-and-docker:
    name: release and docker
    runs-on: ubuntu-latest
    needs:
      - build-linux-x86
      - build-linux-arm
      - build-linux-mips
      - build-linux-misc
      - build-darwin
      - build-freebsd
      - build-windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: ./bin
          merge-multiple: true

      - name: Show artifacts
        run: ls -lah ./bin

      - name: Release to current repository
        uses: softprops/action-gh-release@v2
        with:
          files: ./bin/*
          body_path: './CHANGELOG.md'
          tag_name: ${{ github.ref_name }}
          token: ${{ secrets.MIAOSPEED_REPO_TOKEN }}

      - name: Release to another repository
        uses: softprops/action-gh-release@v2
        with:
          files: ./bin/*
          body_path: './CHANGELOG.md'
          tag_name: ${{ github.ref_name }}
          repository: AirportR/miaospeed
          token: ${{ secrets.MIAOSPEED_REPO_TOKEN }}

      - name: Resolve release tag for Docker image
        run: |
          echo "MIAOSPEED_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "The tag is ${{ github.ref_name }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/miaospeed:${{ env.MIAOSPEED_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/miaospeed:latest
          platforms: linux/386,linux/amd64,linux/arm/v7,linux/arm64/v8

      - name: Logout from Docker Hub
        run: docker logout